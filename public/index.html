<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
    <h1>Albums</h1>
    
    <form id="form">
        <label>
            Album
            <input id="album" name="album"/>
            <div id="autocomplete" class="autocomplete"></div>
        </label>
        <label>
            Artist
            <input id="artist" name="artist"/>
        </label>
        <button id="submit" type="submit">find similar albums</button>
    </form>

    <p id="status"></p>
    <h2>Seed</h2>
    <div id="seed" class="seed-summary">-</div>

    <h2>Similar Albums</h2>
    <ul id="results"></ul>

    <script src="./app.js"></script>
</div>
</body>
</html>
