<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
    <h1>Albums <span>(find similar albums)</span></h1>
    
    <form id="form">
        <label>
            Album
            <input id="album" name="album"/>
            <div id="autocomplete" class="autocomplete"></div>
        </label>
        <label>
            Artist
            <input id="artist" name="artist"/>
        </label>
        <button id="submit" type="submit">find similar albums</button>
    </form>

    <p id="status"></p>
    <hr class="divider"/>
    <p class="section-label">Searching for</p>
    <div id="seed" class="seed-summary">-</div>

    <p class="section-label">Similar Albums</p>
    <ul id="results"></ul>

    <script src="./app.js"></script>
</div>
<footer><a href="https://github.com/sen3th/albums" target="_blank">GitHub</a> - <a href="https://seneth.me/" target="_blank">Seneth</a></footer>
</body>
</html>
